<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viña Los Alisos · Mapa de plantas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0ea; --panel:#fbfbf8; --ink:#1c2620; --muted:#66705f; --line:#d9dcd2; --accent:#7b1e3c; --chip:#e6e9df;
  --map:#1d231b; --block:#262e22; --blockline:#3a4534;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12150f;--panel:#1a1f17;--ink:#e8ebe2;--muted:#9aa393;--line:#2e362a;--accent:#e08aa3;--chip:#262d22;--map:#0f130d;--block:#171d14;--blockline:#2f3a2b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#12150f;--panel:#1a1f17;--ink:#e8ebe2;--muted:#9aa393;--line:#2e362a;--accent:#e08aa3;--chip:#262d22;--map:#0f130d;--block:#171d14;--blockline:#2f3a2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:1fr 360px;height:100%}
.map{position:relative;background:var(--map);overflow:hidden;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
.title{position:absolute;left:16px;top:14px;pointer-events:none;color:#e8ebe2;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.title b{font-size:18px;font-weight:700;display:block}
.title span{font-size:13px;opacity:.75}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(20,25,18,.8);color:#fff;font-size:18px;cursor:pointer}
.zoom button:focus-visible,.layer:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scale{position:absolute;left:16px;bottom:14px;color:#e8ebe2;font-size:12px;pointer-events:none}
.scale i{display:block;height:4px;border:1.5px solid #e8ebe2;border-top:none;margin-bottom:3px}
.tip{position:absolute;pointer-events:none;background:rgba(15,19,13,.95);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.18);white-space:nowrap;display:none;transform:translate(12px,12px)}
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 24px;min-height:0}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.layer{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;cursor:pointer;color:var(--ink);font:inherit}
.layer .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);flex:none}
.layer small{display:block;color:var(--muted);font-size:12px}
.layer[aria-checked="true"]{border-color:var(--accent);background:var(--chip)}
.layer[aria-checked="true"] .dot{border-color:var(--accent);background:var(--accent)}
.up{margin:4px 0 16px;border:1.5px dashed var(--line);border-radius:9px;padding:10px;font-size:13px;color:var(--muted);text-align:center}
.legend{margin:14px 0 20px}
.bar{height:10px;border-radius:5px}
.lg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.card{border-top:1px solid var(--line);padding-top:16px}
.empty{color:var(--muted);font-size:14px;line-height:1.5}
.pid{font-size:20px;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.st{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--chip)}
.st.warn{background:#f3d9a8;color:#5b3a00}
.row{margin:12px 0}
.row .h{display:flex;justify-content:space-between;font-size:13px}
.row .h b{font-weight:500}
.track{position:relative;height:6px;background:var(--chip);border-radius:3px;margin-top:6px}
.track i{position:absolute;top:-3px;width:3px;height:12px;background:var(--muted);border-radius:2px}
.track em{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-left:-6px;border:2px solid var(--panel)}
.btn{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}
.meta{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
.fl{font-size:13px;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{background:transparent;color:var(--accent);padding:6px 0;margin:8px 0 10px;visibility:hidden}
.cmpl{display:flex;gap:8px;align-items:center;font-size:13px;margin:12px 0 8px}
select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;margin-bottom:6px}
.dsec{margin-bottom:18px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.hist{margin:16px 0 4px}
.hist .h{font-size:13px;margin-bottom:2px}
.hist text{font-size:10px;fill:var(--muted);font-family:inherit}
.hist circle{cursor:pointer}
.hist circle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:56% 44%}
  .side{border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <div class="map" id="map">
    <canvas id="cv" aria-label="Mapa de plantas de la viña"></canvas>
    <div class="title"><b>Viña Los Alisos</b><span><span id="ttl"></span> · 4 cuarteles · <span id="count"></span> plantas</span></div>
    <div class="zoom">
      <button id="zi" aria-label="Acercar">+</button>
      <button id="zo" aria-label="Alejar">−</button>
      <button id="zr" aria-label="Ver todo el campo">⌂</button>
    </div>
    <div class="scale" id="scale"></div>
    <div class="tip" id="tip"></div>
  </div>
  <aside class="side">
    <div class="dsec">
      <h2>Fecha de lectura</h2>
      <input type="range" id="dr" min="0" max="5" step="1" value="5" aria-label="Fecha de lectura" style="width:100%;accent-color:var(--accent)">
      <div class="lg"><span id="dlab"></span><span id="dnote"></span></div>
      <label class="cmpl"><input type="checkbox" id="cc"> Comparar con otra fecha</label>
      <select id="cs" aria-label="Fecha de comparación" hidden></select>
    </div>
    <h2>Filtros</h2>
    <div class="fl">Cuartel</div><div class="chips" id="fb"></div>
    <div class="fl">Variedad</div><div class="chips" id="fv"></div>
    <button class="btn ghost" id="fclear">Limpiar filtros</button>
    <h2 style="margin-top:14px">Capas cargadas</h2>
    <div id="layers" role="radiogroup" aria-label="Parámetro a visualizar"></div>
    <div class="up">Arrastra aquí CSV, GeoTIFF o shapefile para agregar una capa</div>
    <div class="legend">
      <div class="bar" id="bar"></div>
      <div class="lg"><span id="lmin"></span><span id="lname"></span><span id="lmax"></span></div>
      <div class="lg" style="margin-top:8px"><span id="avg"></span></div>
    </div>
    <div class="card" id="detail"></div>
  </aside>
</div>
<script>
(function(){
var seed=11;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
var PAR=[
 {k:'ndvi',n:'NDVI (vigor)',u:'',a:.35,b:.88,f:'ndvi_dron_2026-10-12.tif',d:2},
 {k:'hum',n:'Humedad de suelo',u:'%',a:12,b:34,f:'sensores_suelo.csv',d:1},
 {k:'psi',n:'Potencial hídrico',u:'MPa',a:-1.6,b:-0.4,f:'camara_presion.csv',d:2},
 {k:'brix',n:'Grados Brix',u:'°Bx',a:18,b:25.5,f:'muestreo_madurez.xlsx',d:1},
 {k:'rend',n:'Rendimiento estimado',u:'kg/planta',a:1.2,b:4.6,f:'conteo_racimos.csv',d:1}
];
var DT=['18 mar 2025','15 sep 2025','10 dic 2025','12 feb 2026','18 mar 2026','12 oct 2026'];
var SEAS=[[.02,-.2,-.05,.1,.04,-.08],[.05,-.1,-.2,-.05,0,.1],[-.05,.05,-.15,-.1,-.12,.1],[.15,-.3,-.25,-.1,.15,-.28],[.04,-.15,-.05,.08,.02,-.1]];
var dt=5,cmp=-1;
var BL=[
 {id:'A',n:'Cabernet Sauvignon y Merlot',v:[[20,'Cabernet Sauvignon'],[30,'Merlot']],x:0,y:0,w:110,h:72},
 {id:'B',n:'Carménère y Cabernet Franc',v:[[22,'Carménère'],[30,'Cabernet Franc']],x:124,y:0,w:110,h:72},
 {id:'C',n:'Syrah',v:[[30,'Syrah']],x:0,y:88,w:110,h:72},
 {id:'D',n:'Sauvignon Blanc y Chardonnay',v:[[18,'Sauvignon Blanc'],[30,'Chardonnay']],x:124,y:88,w:110,h:72}
];
var FW=234,FH=160,SP=1.2,RS=2.4;
var LAT=-34.65,LON=-71.38;
function clamp(v){return v<0?0:v>1?1:v}
function g(x,y,p){return .5+.28*Math.sin(x/41+p*.5)+.22*Math.cos(y/33-p*.4)+.12*Math.sin((x+y)/15+p*.3)}
var pts=[],mean={};
BL.forEach(function(b,bi){
  var nr=Math.floor(b.h/RS),np=Math.floor(b.w/SP);
  for(var r=0;r<nr;r++)for(var i=0;i<np;i++){
    var vn=b.v.filter(function(s){return r+1<=s[0]})[0][1];var o={bl:bi,r:r+1,i:i+1,x:b.x+1+i*SP,y:b.y+1+r*RS,va:vn,t:[]};
    for(var p=0;p<PAR.length;p++)o.t.push(clamp(g(o.x,o.y,p)*.9+(rnd()-.5)*.22+(bi*.02)));
    o.H=[];for(var d=0;d<6;d++)o.H.push(o.t.map(function(v,p){return clamp(v+SEAS[p][d]+.1*Math.sin(o.x/23+o.y/31+d*1.7+p)+(rnd()-.5)*.06)}));o.t=o.H[5];pts.push(o);
  }
});
function calcMean(){PAR.forEach(function(P,p){var s=[0,0,0,0],c=[0,0,0,0];pts.forEach(function(o){s[o.bl]+=o.t[p];c[o.bl]++});mean[p]=s.map(function(v,i){return v/c[i]})})}calcMean();
var VARS=['Cabernet Sauvignon','Merlot','Carménère','Cabernet Franc','Syrah','Sauvignon Blanc','Chardonnay'],fb={},fv={},dim='rgba(130,140,120,.16)';
function on(o){return (!Object.keys(fb).length||fb[BL[o.bl].id])&&(!Object.keys(fv).length||fv[o.va])}
function vis(){return pts.filter(on)}
function chip(box,label,set,key){var b=document.createElement('button');b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',!!set[key]);b.onclick=function(){if(set[key])delete set[key];else set[key]=1;if(sel&&!on(sel)){sel=null;renderDetail()}renderFilters();draw()};box.appendChild(b)}
function renderFilters(){
  var a=document.getElementById('fb'),c=document.getElementById('fv');a.innerHTML='';c.innerHTML='';
  BL.forEach(function(b){chip(a,'Cuartel '+b.id,fb,b.id)});
  VARS.forEach(function(v){chip(c,v,fv,v)});
  document.getElementById('count').textContent=vis().length.toLocaleString('es-CL')+' de '+pts.length.toLocaleString('es-CL');
  document.getElementById('fclear').style.visibility=Object.keys(fb).length+Object.keys(fv).length?'visible':'hidden';
  renderLegend();
}
document.getElementById('fclear').onclick=function(){[fb,fv].forEach(function(s){Object.keys(s).forEach(function(k){delete s[k]})});renderFilters();draw()};

var stops=['#440154','#3b528b','#21918c','#5ec962','#fde725'];
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
var pal=[];for(var k=0;k<256;k++){var t=k/255*4,j=Math.min(3,Math.floor(t)),f=t-j,a=hex(stops[j]),b=hex(stops[j+1]);pal.push('rgb('+a.map(function(v,n){return Math.round(v+(b[n]-v)*f)}).join(',')+')')}
document.getElementById('bar').style.background='linear-gradient(90deg,'+stops.join(',')+')';

var dpal=[];(function(){var s=[hex('#d95f02'),hex('#e9e7df'),hex('#1b9e77')];for(var k=0;k<256;k++){var t=k/255*2,j=Math.min(1,Math.floor(t)),f=t-j,a=s[j],b=s[j+1];dpal.push('rgb('+a.map(function(v,n){return Math.round(v+(b[n]-v)*f)}).join(',')+')')}})();
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,dpr=1;
var sc=1,ox=0,oy=0,minSc=1,cur=0,sel=null,hov=null;
function fit(){minSc=Math.min(W/(FW+30),H/(FH+30));sc=minSc;ox=(W-FW*sc)/2;oy=(H-FH*sc)/2}
function resize(){var r=cv.parentNode.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!minSc||sc<=minSc*1.001)fit();draw()}
function zoomAt(cx,cy,f){var n=Math.max(minSc,Math.min(110,sc*f));f=n/sc;ox=cx-(cx-ox)*f;oy=cy-(cy-oy)*f;sc=n;draw()}

function draw(){
  var cs=getComputedStyle(document.documentElement);
  ctx.fillStyle=cs.getPropertyValue('--map');ctx.fillRect(0,0,W,H);
  BL.forEach(function(b){
    var x=ox+b.x*sc,y=oy+b.y*sc;
    ctx.fillStyle=cs.getPropertyValue('--block');ctx.strokeStyle=cs.getPropertyValue('--blockline');ctx.lineWidth=1;
    ctx.fillRect(x-3*sc,y-3*sc,(b.w+4)*sc,(b.h+4)*sc);ctx.strokeRect(x-3*sc,y-3*sc,(b.w+4)*sc,(b.h+4)*sc);
  });
  var P=PAR[cur],sp=SP*sc,r=Math.max(1,Math.min(sp*.32,16));
  for(var n=0;n<pts.length;n++){
    var o=pts[n],x=ox+o.x*sc,y=oy+o.y*sc;
    if(x<-20||y<-20||x>W+20||y>H+20)continue;
    ctx.fillStyle=on(o)?(cmp>=0?dpal[Math.floor(clamp(.5+(o.t[cur]-o.H[cmp][cur])*2.5)*255)]:pal[Math.floor(o.t[cur]*255)]):dim;
    if(r<2){ctx.fillRect(x-r,y-r,r*2,r*2)}else{ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill()}
  }
  if(sc>minSc*1.0){
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='600 '+Math.max(11,Math.min(15,sc*3))+'px Bricolage Grotesque,sans-serif';
    if(sc<14)BL.forEach(function(b){ctx.fillText('Cuartel '+b.id+' · '+b.n,ox+b.x*sc,oy+(b.y-4.5)*sc)});
  }
  [hov,sel].forEach(function(o,q){if(!o)return;ctx.beginPath();ctx.arc(ox+o.x*sc,oy+o.y*sc,r+3,0,6.2832);ctx.lineWidth=q?2.5:1.5;ctx.strokeStyle=q?'#fff':'rgba(255,255,255,.7)';ctx.stroke()});
  var m=sc>=8?5:sc>=3?20:50,bar=m*sc;
  document.getElementById('scale').innerHTML='<i style="width:'+bar+'px"></i>'+m+' m';
}

function pick(px,py){
  var best=null,bd=Math.pow(Math.max(8,Math.min(SP*sc*.5,18)),2);
  for(var n=0;n<pts.length;n++){var o=pts[n],dx=ox+o.x*sc-px,dy=oy+o.y*sc-py,d=dx*dx+dy*dy;if(d<bd&&on(o)){bd=d;best=o}}
  return best;
}
function fmt(v,P){var x=P.a+v*(P.b-P.a);return x.toFixed(P.d).replace('.',',')+(P.u?' '+P.u:'')}
function pid(o){return BL[o.bl].id+'-F'+String(o.r).padStart(2,'0')+'-P'+String(o.i).padStart(3,'0')}
function coords(o){var la=LAT-o.y/111320,lo=LON+o.x/(111320*Math.cos(LAT*Math.PI/180));return la.toFixed(6).replace('.',',')+', '+lo.toFixed(6).replace('.',',')}

function renderLayers(){
  var L=document.getElementById('layers');L.innerHTML='';
  PAR.forEach(function(P,i){
    var b=document.createElement('button');b.className='layer';b.setAttribute('role','radio');b.setAttribute('aria-checked',i===cur);
    b.innerHTML='<span class="dot"></span><span>'+P.n+'<small>'+P.f+'</small></span>';
    b.onclick=function(){cur=i;renderLayers();renderLegend();renderDetail();draw()};
    L.appendChild(b);
  });
}
function renderLegend(){var P=PAR[cur],v=vis(),R=P.b-P.a,u=P.u?' '+P.u:'',bar=document.getElementById('bar'),none='Ninguna planta coincide con los filtros';
  function nf(x){return Math.abs(x).toFixed(P.d).replace('.',',')}
  if(cmp>=0){var md=v.length?v.reduce(function(s,o){return s+o.t[cur]-o.H[cmp][cur]},0)/v.length:0;bar.style.background='linear-gradient(90deg,#d95f02,#e9e7df,#1b9e77)';lmin.textContent='−'+nf(.2*R);lmax.textContent='+'+nf(.2*R)+u;lname.textContent='Cambio en '+P.n;avg.textContent=v.length?'Cambio promedio: '+(md>=0?'+':'−')+nf(md*R)+u:none}
  else{var m=v.length?v.reduce(function(s,o){return s+o.t[cur]},0)/v.length:0;bar.style.background='linear-gradient(90deg,'+stops.join(',')+')';lmin.textContent=fmt(0,P);lmax.textContent=fmt(1,P);lname.textContent=P.n;avg.textContent=v.length?'Promedio de las plantas visibles: '+fmt(m,P):none}}
var MC={};
function bmean(bl,p,d){var k=bl+'-'+p+'-'+d;if(MC[k]==null){var s=0,c=0;pts.forEach(function(o){if(o.bl===bl){s+=o.H[d][p];c++}});MC[k]=s/c}return MC[k]}
function hist(o){
  var P=PAR[cur],R=P.b-P.a,s=[],m=[],i;
  for(i=0;i<DT.length;i++){s.push(o.H[i][cur]);m.push(bmean(o.bl,cur,i))}
  var all=s.concat(m),lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=Math.max(.08,(hi-lo)*.15);lo-=pad;hi+=pad;
  var L=34,Rr=10,T=10,B=26,w=300,h=130,iw=w-L-Rr,ih=h-T-B;
  function X(i){return L+iw*i/(DT.length-1)}function Y(v){return T+ih*(1-(v-lo)/(hi-lo))}
  function pl(a){return a.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ')}
  function num(v){return (P.a+v*R).toFixed(P.d).replace('.',',')}
  var g='<svg viewBox="0 0 300 130" width="100%" role="group" aria-label="Historial de '+P.n+'">';
  g+='<text x="'+(L-5)+'" y="'+(T+4)+'" text-anchor="end">'+num(hi)+'</text><text x="'+(L-5)+'" y="'+(T+ih+3)+'" text-anchor="end">'+num(lo)+'</text>';
  g+='<line x1="'+L+'" x2="'+(w-Rr)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" stroke="var(--line)"/>';
  g+='<polyline points="'+pl(m)+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  g+='<polyline points="'+pl(s)+'" fill="none" stroke="var(--accent)" stroke-width="2.2"/>';
  s.forEach(function(v,i){
    var cu=i===dt,cp=i===cmp,lab=DT[i].split(' ').slice(1).map(function(t,k){return k?t.slice(2):t}).join(' ');
    g+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle"'+(cu?' style="fill:var(--ink);font-weight:700"':'')+'>'+lab+'</text>';
    g+='<circle data-i="'+i+'" tabindex="0" role="button" aria-label="Ver '+DT[i]+'" cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(cu?6:4.5)+'" fill="'+(cu?'var(--accent)':'var(--panel)')+'" stroke="var(--accent)" stroke-width="2"'+(cp?' stroke-dasharray="2 2"':'')+'><title>'+DT[i]+': '+num(v)+(P.u?' '+P.u:'')+'</title></circle>';
  });
  return '<div class="hist"><div class="h"><span>Historial de '+P.n+'</span></div>'+g+'</svg><div class="meta" style="margin-top:0">Línea continua: esta planta. Punteada: promedio del cuartel. Toca un punto para ir a esa fecha.</div></div>';
}
function wireHist(D){D.querySelectorAll('[data-i]').forEach(function(c){function go(){dt=+c.getAttribute('data-i');document.getElementById('dr').value=dt;setDate()}c.onclick=go;c.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function dl(o,p){if(cmp<0)return '';var d=(o.t[p]-o.H[cmp][p])*(PAR[p].b-PAR[p].a);return ' <small style="color:var(--muted);font-weight:400">('+(d>=0?'+':'−')+Math.abs(d).toFixed(PAR[p].d).replace('.',',')+')</small>'}
function renderDetail(){
  var D=document.getElementById('detail');
  if(!sel){D.innerHTML='<p class="empty">Acerca el mapa y selecciona una planta para ver todos sus parámetros, su ubicación y su historial.</p>';return}
  var o=sel,b=BL[o.bl],warn=o.t[0]<.28||o.t[2]<.22;
  var h='<p class="pid">'+pid(o)+'</p><p class="sub">Cuartel '+b.id+' · '+o.va+' · fila '+o.r+', planta '+o.i+'</p>';
  h+='<span class="st'+(warn?' warn':'')+'">'+(warn?'Atención: posible estrés hídrico':'Estado normal')+'</span>';h+=hist(o);
  PAR.forEach(function(P,p){
    h+='<div class="row"><div class="h"><span>'+P.n+'</span><b>'+fmt(o.t[p],P)+dl(o,p)+'</b></div><div class="track"><i style="left:'+(mean[p][o.bl]*100)+'%" title="Promedio del cuartel"></i><em style="left:'+(o.t[p]*100)+'%"></em></div></div>';
  });
  h+='<div class="meta">La marca gris indica el promedio del cuartel.<br>Coordenadas: '+coords(o)+'<br>Plantada: 2014 · Portainjerto 101-14<br>Fecha de lectura: '+DT[dt]+(cmp>=0?' (comparada con '+DT[cmp]+')':'')+'</div>';
  h+='<button class="btn" id="go">Acercar a esta planta</button>';
  D.innerHTML=h;wireHist(D);
  document.getElementById('go').onclick=function(){var f=60/sc;ox=W/2-(W/2-ox-0)*1;sc=60;ox=W/2-o.x*sc;oy=H/2-o.y*sc;draw()};
}

var ptrs={},moved=0,pd=0,tip=document.getElementById('tip');
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.offsetX,y:e.offsetY};moved=0;pd=Object.keys(ptrs).length>1?pd:0;cv.classList.add('drag')});
cv.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId],ids=Object.keys(ptrs);
  if(p){
    if(ids.length===2){
      var o=ptrs[ids[0]==e.pointerId?ids[1]:ids[0]],d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.offsetX-o.x,e.offsetY-o.y);
      if(d0>0)zoomAt((e.offsetX+o.x)/2,(e.offsetY+o.y)/2,d1/d0);moved=99;
    }else{moved+=Math.abs(e.offsetX-p.x)+Math.abs(e.offsetY-p.y);ox+=e.offsetX-p.x;oy+=e.offsetY-p.y;draw()}
    p.x=e.offsetX;p.y=e.offsetY;return;
  }
  var o2=pick(e.offsetX,e.offsetY);
  if(o2!==hov){hov=o2;draw()}
  if(o2){tip.style.display='block';tip.style.left=e.offsetX+'px';tip.style.top=e.offsetY+'px';tip.innerHTML='<b>'+pid(o2)+'</b> · '+PAR[cur].n+': '+fmt(o2.t[cur],PAR[cur])}else tip.style.display='none';
});
cv.addEventListener('pointerup',function(e){
  var was=ptrs[e.pointerId];delete ptrs[e.pointerId];cv.classList.remove('drag');
  if(was&&moved<6){var o=pick(e.offsetX,e.offsetY);sel=o;renderDetail();draw()}
});
cv.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];cv.classList.remove('drag')});
cv.addEventListener('pointerleave',function(){hov=null;tip.style.display='none';draw()});
cv.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.25:.8)},{passive:false});
cv.addEventListener('dblclick',function(e){zoomAt(e.offsetX,e.offsetY,2)});
zi.onclick=function(){zoomAt(W/2,H/2,1.6)};zo.onclick=function(){zoomAt(W/2,H/2,1/1.6)};zr.onclick=function(){fit();draw()};
window.addEventListener('resize',resize);
function setDate(){
  pts.forEach(function(o){o.t=o.H[dt]});calcMean();
  var s=document.getElementById('cs');s.innerHTML='';
  DT.forEach(function(d,i){if(i!==dt){var op=document.createElement('option');op.value=i;op.textContent=d;s.appendChild(op)}});
  if(cmp>=0){if(cmp===dt)cmp=+s.options[0].value;s.value=cmp}
  document.getElementById('ttl').textContent=cmp>=0?DT[dt]+' frente a '+DT[cmp]:DT[dt];
  document.getElementById('dlab').textContent=DT[dt];document.getElementById('dnote').textContent=dt===5?'Última lectura':'';
  renderFilters();renderDetail();draw();
}
document.getElementById('dr').oninput=function(){dt=+this.value;setDate()};
document.getElementById('cc').onchange=function(){var s=document.getElementById('cs');s.hidden=!this.checked;cmp=this.checked?+s.value:-1;setDate()};
document.getElementById('cs').onchange=function(){cmp=+this.value;setDate()};
setDate();renderLayers();renderLegend();renderDetail();resize();
})();
</script>
</body>
</html>
